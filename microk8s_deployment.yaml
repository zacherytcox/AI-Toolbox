apiVersion: v1
kind: Namespace
metadata:
  name: ai-toolbox
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ai-toolbox-deployment
  namespace: ai-toolbox
  labels:
    app: ai-toolbox
spec:
  # replicas: 2
  selector:
    matchLabels:
      app: ai-toolbox
  template:
    metadata:
      labels:
        app: ai-toolbox
    spec:
      containers:
      - name: ai-toolbox
        image: localhost:32000/ai-toolbox:latest
        ports:
        - containerPort: 80
        env:
        - name: STREAMLIT_SERVER_PORT
          value: 80
